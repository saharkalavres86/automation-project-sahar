<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Social — Games Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .social-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 2rem 3rem;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
            align-items: start;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .sidebar-card {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 16px;
            border: 1px solid rgba(120, 40, 200, 0.3);
            overflow: hidden;
        }

        .sidebar-card-header {
            padding: 1rem 1.2rem;
            border-bottom: 1px solid rgba(120, 40, 200, 0.2);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            color: #00c8ff;
            letter-spacing: 1px;
        }

        .sidebar-card-body { padding: 1rem 1.2rem; }

        .search-input {
            width: 100%;
            padding: 0.7rem 1rem;
            border-radius: 8px;
            border: 2px solid rgba(120, 40, 200, 0.4);
            background: rgba(120, 40, 200, 0.08);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            outline: none;
            transition: all 0.3s;
            box-sizing: border-box;
        }

        .search-input:focus {
            border-color: #00c8ff;
            background: rgba(0, 200, 255, 0.08);
        }

        .search-input::placeholder { color: #444; }

        .user-result {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.7rem 0;
            border-bottom: 1px solid rgba(120, 40, 200, 0.1);
        }

        .user-result:last-child { border-bottom: none; }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid #7828c8;
            object-fit: cover;
            flex-shrink: 0;
        }

        .user-avatar-placeholder {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid #7828c8;
            background: linear-gradient(135deg, #7828c8, #ff3c78);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .user-info { flex: 1; min-width: 0; }

        .user-name {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .follow-btn {
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            border: 1px solid #7828c8;
            background: transparent;
            color: #7828c8;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .follow-btn.following {
            background: #7828c8;
            color: #fff;
        }

        .follow-btn:hover { opacity: 0.8; }

        .feed-item {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 16px;
            border: 1px solid rgba(120, 40, 200, 0.3);
            overflow: hidden;
            display: flex;
            gap: 1rem;
            padding: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .feed-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(120, 40, 200, 0.2);
        }

        .feed-game-img {
            width: 80px;
            height: 55px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
            background: #16213e;
        }

        .feed-content { flex: 1; min-width: 0; }

        .feed-user {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.4rem;
        }

        .feed-user-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 1px solid #7828c8;
            object-fit: cover;
        }

        .feed-user-avatar-placeholder {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 1px solid #7828c8;
            background: linear-gradient(135deg, #7828c8, #ff3c78);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
        }

        .feed-user-name {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            color: #00c8ff;
            cursor: pointer;
        }

        .feed-user-name:hover { text-decoration: underline; }

        .feed-action {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.85rem;
            color: #888;
        }

        .feed-game-name {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 0.3rem;
        }

        .feed-status-badge {
            display: inline-block;
            padding: 0.15rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            font-family: 'Rajdhani', sans-serif;
        }

        .feed-time {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.75rem;
            color: #555;
            margin-top: 0.3rem;
        }

        .feed-empty {
            text-align: center;
            padding: 3rem;
            color: #555;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: #00c8ff;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(0, 200, 255, 0.2);
        }

        .feed-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .not-logged-in {
            text-align: center;
            padding: 4rem 2rem;
            grid-column: 1 / -1;
        }

        .not-logged-in p {
            color: #888;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }

        .stats-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .stat-pill {
            background: rgba(120, 40, 200, 0.1);
            border: 1px solid rgba(120, 40, 200, 0.3);
            border-radius: 20px;
            padding: 0.3rem 0.8rem;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.8rem;
            color: #ccc;
            cursor: pointer;
            transition: all 0.2s;
        }

        .stat-pill:hover { border-color: #7828c8; color: #fff; }

        .search-results { margin-top: 0.8rem; }

        @media (max-width: 768px) {
            .social-container { grid-template-columns: 1fr; padding: 0 1rem 2rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1>👥 Social</h1>
        <p>See what your friends are playing</p>
        <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-top:1rem;">
            <a href="/" style="display:inline-block;background:linear-gradient(90deg,#ff3c78,#7828c8);color:white;padding:0.5rem 1.5rem;border-radius:20px;font-family:'Orbitron',sans-serif;font-size:0.75rem;text-decoration:none;letter-spacing:1px;box-shadow:0 0 15px rgba(255,60,120,0.5);">🎮 BACK TO GAMES</a>
            <a href="/library" style="display:inline-block;background:linear-gradient(90deg,#00c8ff,#7828c8);color:white;padding:0.5rem 1.5rem;border-radius:20px;font-family:'Orbitron',sans-serif;font-size:0.75rem;text-decoration:none;letter-spacing:1px;box-shadow:0 0 15px rgba(0,200,255,0.5);">📚 MY LIBRARY</a>
            <a href="/profile" style="display:inline-block;background:linear-gradient(90deg,#7828c8,#ff3c78);color:white;padding:0.5rem 1.5rem;border-radius:20px;font-family:'Orbitron',sans-serif;font-size:0.75rem;text-decoration:none;letter-spacing:1px;box-shadow:0 0 15px rgba(120,40,200,0.5);">👤 MY PROFILE</a>
        </div>
    </header>

    <div class="social-container" id="social-container">
        <div id="not-logged-in" class="not-logged-in" style="display:none;">
            <p>Sign in to access social features</p>
            <a href="/auth" style="display:inline-block;background:linear-gradient(90deg,#ff3c78,#7828c8);color:white;padding:0.7rem 2rem;border-radius:20px;font-family:'Orbitron',sans-serif;font-size:0.75rem;text-decoration:none;letter-spacing:1px;">👤 SIGN IN</a>
        </div>

        <!-- SIDEBAR -->
        <div class="sidebar" id="sidebar" style="display:none;">

            <!-- MY STATS -->
            <div class="sidebar-card">
                <div class="sidebar-card-header">👤 MY SOCIAL</div>
                <div class="sidebar-card-body">
                    <div class="stats-row">
                        <span class="stat-pill" id="following-count" onclick="showTab('following')">0 Following</span>
                        <span class="stat-pill" id="followers-count" onclick="showTab('followers')">0 Followers</span>
                    </div>
                </div>
            </div>

            <!-- FIND USERS -->
            <div class="sidebar-card">
                <div class="sidebar-card-header">🔍 FIND USERS</div>
                <div class="sidebar-card-body">
                    <input type="text" class="search-input" id="user-search-input" placeholder="Search by username...">
                    <div class="search-results" id="user-search-results"></div>
                </div>
            </div>

            <!-- FOLLOWING LIST -->
            <div class="sidebar-card" id="following-card">
                <div class="sidebar-card-header">👥 FOLLOWING</div>
                <div class="sidebar-card-body" id="following-list">
                    <p style="color:#555;font-family:'Rajdhani',sans-serif;font-size:0.9rem;">Not following anyone yet.</p>
                </div>
            </div>
        </div>

        <!-- FEED -->
        <div id="feed-section" style="display:none;">
            <p class="section-title">🎮 FRIENDS ACTIVITY</p>
            <div class="feed-grid" id="feed-grid">
                <div class="feed-empty">Loading activity...</div>
            </div>
        </div>
    </div>

    <script>
        const statusColors = { playing: '#00c8ff', completed: '#00ff88', backlog: '#7828c8', dropped: '#ff3c78' };
        const statusLabels = { playing: '🎮 Playing', completed: '✅ Completed', backlog: '📋 Backlog', dropped: '❌ Dropped' };

        function getToken() { return localStorage.getItem('token'); }
        function authHeaders() {
            return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` };
        }
        function isLoggedIn() { return !!getToken(); }

        function timeAgo(dateStr) {
            const diff = Math.floor((Date.now() - new Date(dateStr)) / 1000);
            if (diff < 60) return 'just now';
            if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
            if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
            return `${Math.floor(diff / 86400)}d ago`;
        }

        function avatarEl(user, size = 36) {
            if (user.avatar_url) {
                return `<img src="${user.avatar_url}" class="user-avatar" style="width:${size}px;height:${size}px;" referrerpolicy="no-referrer">`;
            }
            return `<div class="user-avatar-placeholder" style="width:${size}px;height:${size}px;">👤</div>`;
        }

        async function loadSocial() {
            if (!isLoggedIn()) {
                document.getElementById('not-logged-in').style.display = 'block';
                return;
            }

            document.getElementById('sidebar').style.display = 'flex';
            document.getElementById('feed-section').style.display = 'block';

            await Promise.all([loadFollowing(), loadFeed()]);
        }

        async function loadFollowing() {
            try {
                const [followingRes, followersRes] = await Promise.all([
                    fetch('/api/following', { headers: authHeaders() }),
                    fetch('/api/followers', { headers: authHeaders() })
                ]);
                const following = await followingRes.json();
                const followers = await followersRes.json();

                document.getElementById('following-count').textContent = `${following.length} Following`;
                document.getElementById('followers-count').textContent = `${followers.length} Followers`;

                const list = document.getElementById('following-list');
                if (following.length === 0) {
                    list.innerHTML = '<p style="color:#555;font-family:\'Rajdhani\',sans-serif;font-size:0.9rem;">Not following anyone yet. Search for users above!</p>';
                    return;
                }

                list.innerHTML = following.map(user => `
                    <div class="user-result">
                        ${avatarEl(user)}
                        <div class="user-info">
                            <div class="user-name">${user.display_name}</div>
                        </div>
                        <button class="follow-btn following" onclick="unfollow(${user.id}, this)">✓ Following</button>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Failed to load following:', err);
            }
        }

        async function loadFeed() {
            try {
                const res = await fetch('/api/feed', { headers: authHeaders() });
                const feed = await res.json();
                const grid = document.getElementById('feed-grid');

                if (feed.length === 0) {
                    grid.innerHTML = `
                        <div class="feed-empty">
                            <p style="font-size:1.5rem;margin-bottom:0.5rem;">👥</p>
                            <p>No activity yet. Follow some users to see what they're playing!</p>
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = feed.map(item => `
                    <div class="feed-item">
                        ${item.background_image
                            ? `<img src="${item.background_image}" class="feed-game-img" referrerpolicy="no-referrer">`
                            : `<div class="feed-game-img" style="display:flex;align-items:center;justify-content:center;font-size:1.5rem;">🎮</div>`
                        }
                        <div class="feed-content">
                            <div class="feed-user">
                                ${item.avatar_url
                                    ? `<img src="${item.avatar_url}" class="feed-user-avatar" referrerpolicy="no-referrer">`
                                    : `<div class="feed-user-avatar-placeholder">👤</div>`
                                }
                                <span class="feed-user-name" onclick="window.location.href='/user/${item.user_id}'">${item.display_name}</span>
                                <span class="feed-action">marked as</span>
                                <span class="feed-status-badge" style="background:${statusColors[item.status]};color:${item.status === 'backlog' ? '#fff' : '#000'};">
                                    ${statusLabels[item.status]}
                                </span>
                            </div>
                            <div class="feed-game-name">${item.name}</div>
                            ${item.genres ? `<div style="color:#666;font-family:'Rajdhani',sans-serif;font-size:0.75rem;">${item.genres.split(', ').slice(0,2).join(', ')}</div>` : ''}
                            <div class="feed-time">${timeAgo(item.added_at)}</div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Failed to load feed:', err);
            }
        }

        // User search
        let searchTimeout = null;
        document.getElementById('user-search-input').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();
            const results = document.getElementById('user-search-results');
            if (query.length < 2) { results.innerHTML = ''; return; }
            searchTimeout = setTimeout(() => searchUsers(query), 400);
        });

        async function searchUsers(query) {
            try {
                const res = await fetch(`/api/users/search?query=${encodeURIComponent(query)}`, { headers: authHeaders() });
                const users = await res.json();
                const results = document.getElementById('user-search-results');

                if (users.length === 0) {
                    results.innerHTML = '<p style="color:#555;font-family:\'Rajdhani\',sans-serif;font-size:0.85rem;margin-top:0.5rem;">No users found.</p>';
                    return;
                }

                results.innerHTML = users.map(user => `
                    <div class="user-result">
                        ${avatarEl(user)}
                        <div class="user-info">
                            <div class="user-name">${user.display_name}</div>
                        </div>
                        ${user.is_following
                            ? `<button class="follow-btn following" onclick="unfollow(${user.id}, this)">✓ Following</button>`
                            : `<button class="follow-btn" onclick="follow(${user.id}, this)">+ Follow</button>`
                        }
                    </div>
                `).join('');
            } catch (err) {
                console.error('Failed to search users:', err);
            }
        }

        async function follow(userId, btn) {
            try {
                await fetch(`/api/follow/${userId}`, { method: 'POST', headers: authHeaders() });
                btn.textContent = '✓ Following';
                btn.classList.add('following');
                btn.onclick = () => unfollow(userId, btn);
                loadFollowing();
                loadFeed();
            } catch (err) {
                console.error('Failed to follow:', err);
            }
        }

        async function unfollow(userId, btn) {
            try {
                await fetch(`/api/follow/${userId}`, { method: 'DELETE', headers: authHeaders() });
                btn.textContent = '+ Follow';
                btn.classList.remove('following');
                btn.onclick = () => follow(userId, btn);
                loadFollowing();
                loadFeed();
            } catch (err) {
                console.error('Failed to unfollow:', err);
            }
        }

        loadSocial();
    </script>
</body>
</html>
