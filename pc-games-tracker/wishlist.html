<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Games Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>🔖 My Wishlist</h1>
        <p>Your saved upcoming games</p>
        <a href="/" style="
            display: inline-block;
            margin-top: 1rem;
            background: linear-gradient(90deg, #ff3c78, #7828c8);
            border: none;
            color: white;
            padding: 0.5rem 1.5rem;
            border-radius: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            cursor: pointer;
            letter-spacing: 1px;
            text-decoration: none;
            box-shadow: 0 0 15px rgba(255, 60, 120, 0.5);
        ">🎮 BACK TO GAMES</a>
    </header>

    <div id="wishlist-stats" style="text-align:center;padding:1rem;color:#00c8ff;font-family:'Orbitron',sans-serif;font-size:0.85rem;letter-spacing:1px;"></div>
    <div id="games-grid" class="games-grid"></div>

    <!-- Email Alert Subscription -->
    <div id="alert-section" style="
        max-width:600px;
        margin:2rem auto;
        background:linear-gradient(135deg,#1a1a2e,#16213e);
        border:1px solid #7828c8;
        border-radius:16px;
        padding:2rem;
        text-align:center;
    ">
        <h3 style="font-family:'Orbitron',sans-serif;color:#00c8ff;font-size:1rem;letter-spacing:1px;margin-bottom:0.5rem;">
            🔔 RELEASE ALERTS
        </h3>
        <p style="color:#aaa;font-size:0.9rem;margin-bottom:1.5rem;">
            Get notified by email when your wishlisted games are about to release!
        </p>
        <div style="display:flex;gap:0.5rem;justify-content:center;flex-wrap:wrap;">
            <input type="email" id="alert-email" placeholder="Enter your email..." style="
                padding:0.7rem 1.2rem;
                border-radius:8px;
                border:2px solid #7828c8;
                background:rgba(120,40,200,0.1);
                color:#fff;
                font-size:0.95rem;
                outline:none;
                width:280px;
            ">
            <button onclick="subscribeAlerts()" style="
                background:linear-gradient(90deg,#ff3c78,#7828c8);
                border:none;
                color:white;
                padding:0.7rem 1.5rem;
                border-radius:8px;
                font-family:'Orbitron',sans-serif;
                font-size:0.75rem;
                cursor:pointer;
                letter-spacing:1px;
            ">🔔 SUBSCRIBE</button>
        </div>
        <p id="alert-message" style="margin-top:1rem;font-size:0.85rem;color:#00c8ff;display:none;"></p>
    </div>

    <script src="wishlist.js"></script>
    <script>
    async function subscribeAlerts() {
        const email = document.getElementById('alert-email').value;
        const msg = document.getElementById('alert-message');

        if (!email) {
            msg.textContent = '⚠️ Please enter your email!';
            msg.style.color = '#ff3c78';
            msg.style.display = 'block';
            return;
        }

        try {
            const response = await fetch('/api/subscribe', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await response.json();
            msg.textContent = '✅ Subscribed! You\'ll get alerts when your games are about to release.';
            msg.style.color = '#00c8ff';
            msg.style.display = 'block';
            document.getElementById('alert-email').value = '';
        } catch (error) {
            msg.textContent = '❌ Something went wrong. Please try again.';
            msg.style.color = '#ff3c78';
            msg.style.display = 'block';
        }
    }
    </script>
</body>
</html>
