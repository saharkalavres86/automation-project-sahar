<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>My Wishlist — PC Games Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>🔖 My Wishlist</h1>
        <p>Your saved upcoming games</p>
        <a href="/" style="
            display: inline-block;
            margin-top: 1rem;
            background: linear-gradient(90deg, #ff3c78, #7828c8);
            border: none;
            color: white;
            padding: 0.5rem 1.5rem;
            border-radius: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            cursor: pointer;
            letter-spacing: 1px;
            text-decoration: none;
            box-shadow: 0 0 15px rgba(255, 60, 120, 0.5);
        ">🎮 BACK TO GAMES</a>
    </header>

    <div id="wishlist-stats" style="text-align:center;padding:1rem;color:#00c8ff;font-family:'Orbitron',sans-serif;font-size:0.85rem;letter-spacing:1px;"></div>
    <div id="games-grid" class="games-grid"></div>

    <script src="wishlist.js"></script>
</body>
</html>
