<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Games Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        header { overflow: visible !important; }
    </style>
</head>
<body>
    <header>
        <h1>🎮 Upcoming Games</h1>
        <p>Stay updated with the latest game releases</p>
        <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-top:1rem;">
            <button id="music-btn" onclick="toggleMusic()" style="
                background: linear-gradient(90deg, #ff3c78, #7828c8);
                border: none;
                color: white;
                padding: 0.5rem 1.5rem;
                border-radius: 20px;
                font-family: 'Orbitron', sans-serif;
                font-size: 0.75rem;
                cursor: pointer;
                letter-spacing: 1px;
                box-shadow: 0 0 15px rgba(255, 60, 120, 0.5);
                transition: all 0.3s;
            ">🎵 PLAY MUSIC</button>
            <a href="/wishlist" id="wishlist-nav-btn" style="
                display: inline-block;
                background: linear-gradient(90deg, #7828c8, #00c8ff);
                color: white;
                padding: 0.5rem 1.5rem;
                border-radius: 20px;
                font-family: 'Orbitron', sans-serif;
                font-size: 0.75rem;
                text-decoration: none;
                letter-spacing: 1px;
                box-shadow: 0 0 15px rgba(120, 40, 200, 0.5);
                transition: all 0.3s;
            ">🔖 MY WISHLIST</a>
            <a href="/library" style="
                display: inline-block;
                background: linear-gradient(90deg, #00c8ff, #7828c8);
                color: white;
                padding: 0.5rem 1.5rem;
                border-radius: 20px;
                font-family: 'Orbitron', sans-serif;
                font-size: 0.75rem;
                text-decoration: none;
                letter-spacing: 1px;
                box-shadow: 0 0 15px rgba(0, 200, 255, 0.5);
                transition: all 0.3s;
            ">📚 MY LIBRARY</a>
            <a href="/discover" style="
                display: inline-block;
                background: linear-gradient(90deg, #7828c8, #ff3c78);
                color: white;
                padding: 0.5rem 1.5rem;
                border-radius: 20px;
                font-family: 'Orbitron', sans-serif;
                font-size: 0.75rem;
                text-decoration: none;
                letter-spacing: 1px;
                box-shadow: 0 0 15px rgba(120, 40, 200, 0.5);
                transition: all 0.3s;
            ">🔍 DISCOVER</a>
            <a href="/social" style="
                display: inline-block;
                background: linear-gradient(90deg, #7828c8, #ff3c78);
                color: white;
                padding: 0.5rem 1.5rem;
                border-radius: 20px;
                font-family: 'Orbitron', sans-serif;
                font-size: 0.75rem;
                text-decoration: none;
                letter-spacing: 1px;
                box-shadow: 0 0 15px rgba(120, 40, 200, 0.5);
                transition: all 0.3s;
            ">👥 SOCIAL</a>
            <div style="position:relative;display:inline-block;">
                <button id="notif-btn" onclick="toggleNotifications()" style="
                    background: linear-gradient(90deg, #ff3c78, #7828c8);
                    border: none;
                    color: white;
                    padding: 0.5rem 1.5rem;
                    border-radius: 20px;
                    font-family: 'Orbitron', sans-serif;
                    font-size: 0.75rem;
                    cursor: pointer;
                    letter-spacing: 1px;
                    box-shadow: 0 0 15px rgba(255, 60, 120, 0.5);
                    transition: all 0.3s;
                ">🔔 <span id="notif-count" style="display:none;background:#fff;color:#ff3c78;border-radius:50%;padding:0.1rem 0.4rem;font-size:0.65rem;margin-left:0.2rem;font-weight:900;"></span></button>

                <div id="notif-dropdown" style="
                    display: none;
                    position: fixed;
                    top: 120px;
                    left: 50%;
                    transform: translateX(-50%);
                    width: 360px;
                    max-width: 90vw;
                    background: #1a1a2e;
                    border: 1px solid rgba(120,40,200,0.4);
                    border-radius: 12px;
                    box-shadow: 0 10px 40px rgba(0,0,0,0.7);
                    z-index: 9999;
                    overflow: hidden;
                ">
                    <div style="padding:0.8rem 1rem;border-bottom:1px solid rgba(120,40,200,0.2);display:flex;justify-content:space-between;align-items:center;">
                        <span style="font-family:'Orbitron',sans-serif;font-size:0.75rem;color:#00c8ff;letter-spacing:1px;">🔔 NOTIFICATIONS</span>
                        <div style="display:flex;gap:0.5rem;">
                            <button onclick="markAllRead()" style="background:transparent;border:none;color:#888;font-family:'Rajdhani',sans-serif;font-size:0.75rem;cursor:pointer;font-weight:700;">Mark all read</button>
                            <button onclick="clearAllNotifications()" style="background:transparent;border:none;color:#888;font-family:'Rajdhani',sans-serif;font-size:0.75rem;cursor:pointer;font-weight:700;">Clear all</button>
                        </div>
                    </div>
                    <div id="notif-list" style="max-height:400px;overflow-y:auto;"></div>
                </div>
            </div>
            <a href="/auth" id="auth-nav-btn" style="
                display: inline-block;
                background: linear-gradient(90deg, #ff3c78, #7828c8);
                color: white;
                padding: 0.5rem 1.5rem;
                border-radius: 20px;
                font-family: 'Orbitron', sans-serif;
                font-size: 0.75rem;
                text-decoration: none;
                letter-spacing: 1px;
                box-shadow: 0 0 15px rgba(255, 60, 120, 0.5);
                transition: all 0.3s;
            ">👤 SIGN IN</a>
        </div>
    </header>

    <div class="filters">
        <input type="text" id="search" placeholder="Search games...">
        <select id="sort">
            <option value="name">Name (A-Z)</option>
            <option value="released">Release Date</option>
            <option value="rating">Rating</option>
        </select>
        <select id="genre">
            <option value="">All Genres</option>
            <option value="action">Action</option>
            <option value="rpg">RPG</option>
            <option value="shooter">Shooter</option>
            <option value="adventure">Adventure</option>
            <option value="strategy">Strategy</option>
        </select>
    </div>

    <div id="recently-viewed" style="display:none;margin:1rem 0;border-bottom:1px solid rgba(120,40,200,0.3);padding-bottom:1rem;"></div>

    <div id="loading" class="loading">Loading games...</div>
    <div id="games-grid" class="games-grid"></div>

    <div id="load-more-container" style="text-align:center;padding:2rem;">
        <button id="load-more-btn" onclick="loadMore()" style="
            display: none;
            background: linear-gradient(90deg, #7828c8, #00c8ff);
            border: none;
            color: white;
            padding: 0.8rem 2.5rem;
            border-radius: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(120, 40, 200, 0.5);
            transition: all 0.3s;
        ">⬇️ LOAD MORE</button>
        <p id="games-counter" style="color:#666;font-size:0.8rem;margin-top:0.5rem;font-family:'Rajdhani',sans-serif;"></p>
    </div>

    <script src="app.js"></script>
    <script>
        function isLoggedIn() { return !!localStorage.getItem('token'); }

        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            const authBtn = document.getElementById('auth-nav-btn');

            if (token) {
                fetch('/api/auth/me', {
                    headers: { Authorization: `Bearer ${token}` }
                }).then(res => {
                    if (!res.ok) {
                        localStorage.removeItem('token');
                        localStorage.removeItem('user');
                        authBtn.textContent = '👤 SIGN IN';
                        authBtn.href = '/auth';
                    }
                }).catch(() => {});
            }

            const user = localStorage.getItem('user');
            if (user) {
                const parsed = JSON.parse(user);
                authBtn.textContent = `👤 ${parsed.display_name || 'PROFILE'}`;
                authBtn.href = '/profile';
                authBtn.onclick = null;
            }

            if (token) {
                loadNotifications();
                setInterval(loadNotifications, 60000);
            }
        });

        // ─── NOTIFICATIONS ─────────────────────────────────────────
        async function loadNotifications() {
            if (!isLoggedIn()) return;
            try {
                const res = await fetch('/api/notifications', {
                    headers: { Authorization: `Bearer ${localStorage.getItem('token')}` }
                });
                const notifications = await res.json();
                const unread = notifications.filter(n => !n.is_read).length;

                const countEl = document.getElementById('notif-count');
                if (unread > 0) {
                    countEl.textContent = unread;
                    countEl.style.display = 'inline';
                } else {
                    countEl.style.display = 'none';
                }

                renderNotifications(notifications);
            } catch (err) {
                console.error('Failed to load notifications:', err);
            }
        }

        function renderNotifications(notifications) {
            const list = document.getElementById('notif-list');
            if (!list) return;

            if (notifications.length === 0) {
                list.innerHTML = '<p style="padding:1.5rem;text-align:center;color:#555;font-family:\'Rajdhani\',sans-serif;font-size:0.9rem;">No notifications yet.</p>';
                return;
            }

            list.innerHTML = notifications.map(n => `
                <div onclick="markRead(${n.id})" style="
                    display:flex;gap:0.8rem;padding:0.8rem 1rem;
                    border-bottom:1px solid rgba(120,40,200,0.1);
                    cursor:pointer;
                    background:${n.is_read ? 'transparent' : 'rgba(120,40,200,0.08)'};
                    transition:background 0.2s;
                " onmouseover="this.style.background='rgba(120,40,200,0.15)'"
                   onmouseout="this.style.background='${n.is_read ? 'transparent' : 'rgba(120,40,200,0.08)'}'">
                    ${n.background_image
                        ? `<img src="${n.background_image}" style="width:50px;height:34px;object-fit:cover;border-radius:4px;flex-shrink:0;" referrerpolicy="no-referrer">`
                        : `<div style="width:50px;height:34px;background:#16213e;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.1rem;">🎮</div>`
                    }
                    <div style="flex:1;min-width:0;">
                        <p style="font-family:'Rajdhani',sans-serif;font-size:0.875rem;color:${n.is_read ? '#888' : '#fff'};margin:0;line-height:1.4;">${n.message}</p>
                        <p style="font-family:'Rajdhani',sans-serif;font-size:0.72rem;color:#555;margin:0.2rem 0 0;">${timeAgo(n.created_at)}</p>
                    </div>
                    ${!n.is_read ? '<div style="width:7px;height:7px;border-radius:50%;background:#7828c8;flex-shrink:0;margin-top:0.4rem;"></div>' : ''}
                </div>
            `).join('');
        }

        function timeAgo(dateStr) {
            const diff = Math.floor((Date.now() - new Date(dateStr)) / 1000);
            if (diff < 60) return 'just now';
            if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
            if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
            return `${Math.floor(diff / 86400)}d ago`;
        }

        function toggleNotifications() {
            const dropdown = document.getElementById('notif-dropdown');
            dropdown.style.display = dropdown.style.display === 'none' ? 'block' : 'none';
        }

        async function markRead(id) {
            await fetch(`/api/notifications/read/${id}`, {
                method: 'POST',
                headers: { Authorization: `Bearer ${localStorage.getItem('token')}` }
            });
            loadNotifications();
        }

        async function markAllRead() {
            await fetch('/api/notifications/read', {
                method: 'POST',
                headers: { Authorization: `Bearer ${localStorage.getItem('token')}` }
            });
            loadNotifications();
        }

        async function clearAllNotifications() {
            await fetch('/api/notifications', {
                method: 'DELETE',
                headers: { Authorization: `Bearer ${localStorage.getItem('token')}` }
            });
            loadNotifications();
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#notif-btn') && !e.target.closest('#notif-dropdown')) {
                const dropdown = document.getElementById('notif-dropdown');
                if (dropdown) dropdown.style.display = 'none';
            }
        });
    </script>
</body>
</html>
