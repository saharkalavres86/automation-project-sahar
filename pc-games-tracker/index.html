<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Games Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>🎮 Upcoming Games</h1>
        <p>Stay updated with the latest game releases</p>
        <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-top:1rem;">
            <button id="music-btn" onclick="toggleMusic()" style="
                background: linear-gradient(90deg, #ff3c78, #7828c8);
                border: none;
                color: white;
                padding: 0.5rem 1.5rem;
                border-radius: 20px;
                font-family: 'Orbitron', sans-serif;
                font-size: 0.75rem;
                cursor: pointer;
                letter-spacing: 1px;
                box-shadow: 0 0 15px rgba(255, 60, 120, 0.5);
                transition: all 0.3s;
            ">🎵 PLAY MUSIC</button>
            <a href="/wishlist" id="wishlist-nav-btn" style="
                display: inline-block;
                background: linear-gradient(90deg, #7828c8, #00c8ff);
                border: none;
                color: white;
                padding: 0.5rem 1.5rem;
                border-radius: 20px;
                font-family: 'Orbitron', sans-serif;
                font-size: 0.75rem;
                cursor: pointer;
                letter-spacing: 1px;
                text-decoration: none;
                box-shadow: 0 0 15px rgba(120, 40, 200, 0.5);
                transition: all 0.3s;
            ">🔖 MY WISHLIST</a>
            <a href="/library" style="
                display: inline-block;
                background: linear-gradient(90deg, #00c8ff, #7828c8);
                color: white;
                padding: 0.5rem 1.5rem;
                border-radius: 20px;
                font-family: 'Orbitron', sans-serif;
                font-size: 0.75rem;
                text-decoration: none;
                letter-spacing: 1px;
                box-shadow: 0 0 15px rgba(0, 200, 255, 0.5);
                transition: all 0.3s;
            ">📚 MY LIBRARY</a>
            <a href="/auth" id="auth-nav-btn" style="
                display: inline-block;
                background: linear-gradient(90deg, #ff3c78, #7828c8);
                border: none;
                color: white;
                padding: 0.5rem 1.5rem;
                border-radius: 20px;
                font-family: 'Orbitron', sans-serif;
                font-size: 0.75rem;
                cursor: pointer;
                letter-spacing: 1px;
                text-decoration: none;
                box-shadow: 0 0 15px rgba(255, 60, 120, 0.5);
                transition: all 0.3s;
            ">👤 SIGN IN</a>
        </div>
    </header>

    <div class="filters">
        <input type="text" id="search" placeholder="Search games...">
        <select id="sort">
            <option value="name">Name (A-Z)</option>
            <option value="released">Release Date</option>
            <option value="rating">Rating</option>
        </select>
        <select id="genre">
            <option value="">All Genres</option>
            <option value="action">Action</option>
            <option value="rpg">RPG</option>
            <option value="shooter">Shooter</option>
            <option value="adventure">Adventure</option>
            <option value="strategy">Strategy</option>
        </select>
    </div>

    <div id="recently-viewed" style="display:none;margin:1rem 0;border-bottom:1px solid rgba(120,40,200,0.3);padding-bottom:1rem;"></div>

    <div id="loading" class="loading">Loading games...</div>
    <div id="games-grid" class="games-grid"></div>

    <div id="load-more-container" style="text-align:center;padding:2rem;">
        <button id="load-more-btn" onclick="loadMore()" style="
            display: none;
            background: linear-gradient(90deg, #7828c8, #00c8ff);
            border: none;
            color: white;
            padding: 0.8rem 2.5rem;
            border-radius: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(120, 40, 200, 0.5);
            transition: all 0.3s;
        ">⬇️ LOAD MORE</button>
        <p id="games-counter" style="color:#666;font-size:0.8rem;margin-top:0.5rem;font-family:'Rajdhani',sans-serif;"></p>
    </div>

    <script src="app.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            const authBtn = document.getElementById('auth-nav-btn');

            if (token) {
                fetch('/api/auth/me', {
                    headers: { Authorization: `Bearer ${token}` }
                }).then(res => {
                    if (!res.ok) {
                        localStorage.removeItem('token');
                        localStorage.removeItem('user');
                        authBtn.textContent = '👤 SIGN IN';
                        authBtn.href = '/auth';
                    }
                }).catch(() => {});
            }

            const user = localStorage.getItem('user');
            if (user) {
                const parsed = JSON.parse(user);
                authBtn.textContent = `👤 ${parsed.display_name || 'PROFILE'}`;
                authBtn.href = '/profile';
                authBtn.onclick = null;
            }
        });
    </script>
</body>
</html>
